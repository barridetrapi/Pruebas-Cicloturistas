name: Desplegar App Ciclista en GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Compilar la App para Web Móvil
      run: |
        flet publish main.py --dist-dir ./public

    - name: Configurar Páginas de GitHub
      uses: actions/configure-pages@v4

    - name: Subir artefacto Web
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public'

    - name: Desplegar en internet
      id: deployment
      uses: actions/deploy-pages@v4
